<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enciclopédia interativa de acústica, psicoacústica, eletrônica e fones IEM — com laboratórios de áudio reais no navegador." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ressonância — enciclopédia interativa de áudio</title>
    <script>
      // Aplica o tema antes da primeira pintura para evitar flash.
      (function () {
        var t = 'light';
        try {
          if (localStorage.getItem('res:theme') === 'dark') t = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
